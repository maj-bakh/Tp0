
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de la mise en route</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 18px;
            background-color: #f5f5f5;
            color: #333;
        }

        h1 {
            color: #2457a7;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 650px;
            margin: auto;
        }

        li {
            margin: 12px 0;
            padding: 8px;
            border-radius: 5px;
        }

        .ok {
            color: #0a7d2c;
            background: #e8f8ed;
        }

        .ko {
            color: #c0392b;
            background: #fdecea;
        }

        .info {
            font-size: 12px;
            color: #666;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Bonjour XR !</h1>

    <p>
        Si vous lisez ce texte sur votre téléphone,
        la publication fonctionne.
    </p>

    <h2>Résultats des tests :</h2>

    <ul id="liste">
        <li>Chargement des tests...</li>
    </ul>

    <p id="navigateur" class="info"></p>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const liste = document.getElementById("liste");

    // Fonction pour afficher chaque résultat
    function ligne(nom, ok, aide) {

        const li = document.createElement("li");

        li.className = ok ? "ok" : "ko";

        li.textContent =
            nom + " : " +
            (ok ? "OUI" : "NON") +
            ((!ok && aide) ? " (" + aide + ")" : "");

        liste.appendChild(li);
    }

    // Nettoyer la liste
    liste.innerHTML = "";

    // Vérification HTTPS
    ligne(
        "Connexion sécurisée (HTTPS)",
        window.isSecureContext,
        "HTTPS requis pour certaines fonctionnalités"
    );

    // Vérification caméra
    ligne(
        "Caméra accessible",
        !!(navigator.mediaDevices &&
           navigator.mediaDevices.getUserMedia),
        "HTTPS requis"
    );

    // Vérification capteurs
    ligne(
        "Capteurs de mouvement",
        "DeviceOrientationEvent" in window,
        "Navigateur incompatible ou capteurs indisponibles"
    );

    // Vérification vibration
    ligne(
        "Vibration",
        typeof navigator.vibrate === "function",
        "Non disponible sur certains téléphones"
    );

    // Reconnaissance vocale
    ligne(
        "Reconnaissance vocale",
        !!(window.SpeechRecognition ||
           window.webkitSpeechRecognition),
        "Chrome Android conseillé"
    );

    // WebGL
    let webgl = false;

    try {
        const canvas = document.createElement("canvas");
        webgl = !!(
            canvas.getContext("webgl") ||
            canvas.getContext("experimental-webgl")
        );
    } catch (e) {
        webgl = false;
    }

    ligne(
        "WebGL (3D)",
        webgl,
        "Mettez à jour votre navigateur"
    );

    // Informations du navigateur
    document.getElementById("navigateur").textContent =
        "Navigateur : " + navigator.userAgent;

});
</script>

</body>
</html>
